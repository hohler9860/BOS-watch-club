<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boston Watch Club</title>
    <meta name="description" content="Boston's premier watch collectors community. Join the club.">
    <meta property="og:title" content="Boston Watch Club">
    <meta property="og:description" content="Boston's premier watch collectors community. Join the club.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://boswatchclub.com/">
    <meta property="og:image" content="https://boswatchclub.com/assets/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Boston Watch Club">
    <meta name="twitter:description" content="Boston's premier watch collectors community. Join the club.">
    <meta name="twitter:image" content="https://boswatchclub.com/assets/og-image.png">
    <link rel="canonical" href="https://boswatchclub.com/">
    <link rel="icon" type="image/png" href="/assets/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <!-- Boot splash: separate overlay so it shows for a guaranteed minimum time, then fades out -->
    <div id="boot-splash" style="position:fixed;inset:0;display:grid;place-items:center;background:#07090F;z-index:9999;transition:opacity .45s ease">
        <div style="position:relative;width:120px;height:120px">
            <div style="position:absolute;inset:0;animation:bwcSpin 5.5s linear infinite">
                <span style="position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;transform:translateY(-30px);border-radius:50%;background:radial-gradient(circle at 36% 32%, #f4f7fa, #c7d2de 56%, #8c9aac 100%);box-shadow:0 0 20px rgba(184,196,212,.55), inset -6px -5px 10px rgba(0,0,0,.30)"></span>
                <i style="position:absolute;width:3px;height:3px;left:24%;top:30%;background:#E8ECF0;border-radius:50%;box-shadow:0 0 4px rgba(232,236,240,.8);animation:bwcTwinkle 2.6s ease-in-out infinite"></i>
                <i style="position:absolute;width:2px;height:2px;left:72%;top:34%;background:#E8ECF0;border-radius:50%;box-shadow:0 0 4px rgba(232,236,240,.8);animation:bwcTwinkle 2.6s ease-in-out .5s infinite"></i>
                <i style="position:absolute;width:2.5px;height:2.5px;left:64%;top:66%;background:#E8ECF0;border-radius:50%;box-shadow:0 0 4px rgba(232,236,240,.8);animation:bwcTwinkle 2.6s ease-in-out 1s infinite"></i>
                <i style="position:absolute;width:2px;height:2px;left:30%;top:64%;background:#E8ECF0;border-radius:50%;box-shadow:0 0 4px rgba(232,236,240,.8);animation:bwcTwinkle 2.6s ease-in-out 1.5s infinite"></i>
                <i style="position:absolute;width:2.5px;height:2.5px;left:50%;top:20%;background:#E8ECF0;border-radius:50%;box-shadow:0 0 4px rgba(232,236,240,.8);animation:bwcTwinkle 2.6s ease-in-out 2s infinite"></i>
            </div>
        </div>
    </div>
    <style>@keyframes bwcSpin{to{transform:rotate(360deg)}}@keyframes bwcTwinkle{0%,100%{opacity:.3}50%{opacity:1}}</style>
    <script>
        (function () {
            var start = Date.now(), MIN_MS = 2000;
            function hide() {
                var el = document.getElementById('boot-splash');
                if (!el) return;
                var wait = Math.max(0, MIN_MS - (Date.now() - start));
                setTimeout(function () {
                    el.style.opacity = '0';
                    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 500);
                }, wait);
            }
            if (document.readyState === 'complete') hide();
            else window.addEventListener('load', hide);
        })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
</body>
</html>
