<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>BOS Watch Club — OG Image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Unbounded:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #07090F;
  }

  .og-card {
    width: 1200px;
    height: 630px;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 80% 60% at 50% 45%, rgba(232, 236, 240, 0.03) 0%, transparent 70%),
      radial-gradient(ellipse 50% 80% at 20% 80%, rgba(100, 120, 160, 0.04) 0%, transparent 60%),
      radial-gradient(ellipse 50% 80% at 80% 80%, rgba(100, 120, 160, 0.04) 0%, transparent 60%),
      linear-gradient(180deg, #0a0d15 0%, #07090F 40%, #07090F 100%);
  }

  /* Subtle border accent */
  .og-card::before {
    content: '';
    position: absolute;
    inset: 24px;
    border: 1px solid rgba(232, 236, 240, 0.06);
    border-radius: 4px;
    pointer-events: none;
  }

  /* Top accent line */
  .og-card::after {
    content: '';
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232, 236, 240, 0.2), transparent);
  }

  .logo {
    width: 90px;
    height: auto;
    filter: brightness(0) invert(1);
    margin-bottom: 28px;
    opacity: 0.95;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    color: #E8ECF0;
    letter-spacing: 14px;
    line-height: 1;
    text-align: center;
    margin-bottom: 18px;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(232, 236, 240, 0.3), transparent);
    margin-bottom: 22px;
  }

  .subtitle {
    font-family: 'Unbounded', sans-serif;
    font-weight: 300;
    font-size: 18px;
    color: rgba(232, 236, 240, 0.45);
    letter-spacing: 2px;
    text-align: center;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="og-card">
    <img src="../public/assets/logo.png" alt="BOS Watch Club" class="logo">
    <h1 class="title">BOSTON WATCH CLUB</h1>
    <div class="divider"></div>
    <p class="subtitle">Boston's Premier Watch Collectors Community</p>
  </div>
</body>
</html>
